name: Build AuctionHouseNK

on:
  push:
    branches:
      - master
      - feature/economyexpandnk-currencies
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'README.md'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Download compile-time server libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs
          curl --fail --location --retry 3 \
            https://github.com/PetteriM1/NukkitPetteriM1Edition/releases/latest/download/Nukkit-PM1E.jar \
            --output libs/server.jar
          curl --fail --location --retry 3 \
            https://github.com/PetteriM1/FakeInventories-1/releases/download/release/FakeInventories-1.1.8-PM1E-IWareQ.jar \
            --output libs/FakeInventories-1.1.8-PM1E-IWareQ.jar
          test -s libs/server.jar
          test -s libs/FakeInventories-1.1.8-PM1E-IWareQ.jar
          jar tf libs/server.jar >/dev/null
          jar tf libs/FakeInventories-1.1.8-PM1E-IWareQ.jar >/dev/null

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: AuctionHouse-1.0.0
          path: target/AuctionHouse-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
